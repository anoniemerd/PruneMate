<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Sign in - PruneMate</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='prunemate-icon.svg') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ app_version }}" />
</head>
<body class="login-page">
  <main class="login-card">
    <img class="logo" src="{{ url_for('static', filename='prunemate.png') }}" alt="PruneMate" />
    <h1>Sign in to PruneMate</h1>
    <p class="subtitle">Authentication required to continue</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash" role="alert">{{ messages[-1] }}</div>
      {% endif %}
    {% endwith %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Sign in</button>
    </form>

    <div class="footer">PruneMate v{{ app_version }}</div>
  </main>
</body>
</html>
